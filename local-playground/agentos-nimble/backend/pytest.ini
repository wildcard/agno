[pytest]
testpaths = tests
# Unique basenames and no tests/__init__.py collisions with the host repo's own
# suite; see .claude/rules/pytest-sub-package-tests.md in the integrations
# workspace for why generic test filenames bite in multi-package trees.
python_files = test_*.py
addopts = -q --strict-markers
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
